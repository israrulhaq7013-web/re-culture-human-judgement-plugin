name: Preview Re Culture Approved Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: re-culture-public-guidance-pages-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-public-guidance
    steps:
      - name: Check Out The Existing Reviewed Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6537cc179642e5e752450e0981837246f456f6cf
          persist-credentials: false
      - name: Set Up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply Only The Eight Approved Page Additions
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, hashlib, json
          from pathlib import Path
          p = Path("src/policy-assets.json")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "3475b6ec99a59c5432dbf63b693438aa8e2b4aab68fa07eddd9495c7feb8ec82", "Source Baseline Mismatch"
          a = json.loads(p.read_bytes())
          changes = json.loads(gzip.decompress(base64.b64decode("")))
          expected = {f"/public-guidance/{page}.{lang}.html" for page in ["overview", "privacy", "terms", "support"] for lang in ["en", "ar"]}
          assert set(changes) == expected, "Page Scope Mismatch"
          for record in changes.values():
              assert hashlib.sha256(base64.b64decode(record["base64"])).hexdigest() == record["sha256"], "Page Hash Mismatch"
          a.update(changes)
          result = (json.dumps(a, separators=(",", ":"), ensure_ascii=False) + "\n").encode()
          assert hashlib.sha256(result).hexdigest() == "888c9397e32184105aadb5a3105a1d2421f505770bebd1225efb7f7e084b6dad", "Prepared Source Mismatch"
          p.write_bytes(result)
          config = json.loads(Path("wrangler.jsonc").read_text())
          assert config == {"name":"re-culture-public-guidance-mcp","main":"src/worker.js","compatibility_date":"2026-10-10","observability":{"enabled":False}}, "Worker Config Mismatch"
          config["previews"] = {}
          Path("wrangler.preview.json").write_text(json.dumps(config))
          print("Eight Approved Pages Applied; Shared Assets And Worker Logic Preserved.")
          PYTHON
      - name: Install Locked Dependencies
        run: npm ci --ignore-scripts
      - name: Test The Prepared Source
        run: npm test
      - name: Build The Prepared Source
        run: npm run build
      - name: Enable The Existing Preview URL Without Deploying Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RE_CULTURE_MCP_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RE_CULTURE_MCP_CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||"") || !token) throw new Error("Existing Cloudflare credentials unavailable");
          const base="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/re-culture-public-guidance-mcp";
          async function api(path, method="GET", body) {
            const r=await fetch(base+path,{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
            const j=await r.json();
            if(!r.ok || !j.success) throw new Error("Cloudflare request failed: "+method+" "+path+" HTTP "+r.status);
            return j.result;
          }
          const deployment=await api("/deployments");
          writeFileSync("production-before.json",JSON.stringify(deployment));
          const current=await api("/subdomain");
          if(typeof current.enabled!=="boolean" || typeof current.previews_enabled!=="boolean") throw new Error("Unexpected routing response");
          if(!current.previews_enabled) await api("/subdomain","POST",{enabled:current.enabled,previews_enabled:true});
          const verified=await api("/subdomain");
          if(verified.enabled!==current.enabled || verified.previews_enabled!==true) throw new Error("Preview routing verification failed");
          console.log("Preview URLs enabled; production workers.dev routing preserved.");
          NODE
      - name: Upload An Isolated Preview Only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RE_CULTURE_MCP_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RE_CULTURE_MCP_CF_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler preview --config wrangler.preview.json --name reculture-pages-014 --worker-name re-culture-public-guidance-mcp --ignore-base-config --message "Founder Approved Page Additions; Preview Verification Pending"
      - name: Verify All Eight Preview Pages And Preserve Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RE_CULTURE_MCP_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RE_CULTURE_MCP_CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          const root="https://reculture-pages-014-re-culture-public-guidance-mcp.reculture-independent.workers.dev";
          const assets=JSON.parse(readFileSync("src/policy-assets.json","utf8"));
          const results=[];
          for(const page of ["overview","privacy","terms","support"]) for(const lang of ["en","ar"]) {
            const path="/public-guidance/"+page+"."+lang+".html";
            const expected=assets[path];
            let response, bytes;
            for(let attempt=0;attempt<6;attempt++) {
              response=await fetch(root+path,{signal:AbortSignal.timeout(20000)});
              bytes=Buffer.from(await response.arrayBuffer());
              if(response.status===200) break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            const hash=createHash("sha256").update(bytes).digest("hex");
            if(response.status!==200 || hash!==expected.sha256) throw new Error("Preview page mismatch: "+path+" HTTP "+response.status);
            if(!response.headers.get("content-type")?.includes("text/html") || !response.headers.get("x-robots-tag")?.includes("noindex")) throw new Error("Preview page headers mismatch: "+path);
            results.push({path,status:response.status,sha256:hash});
            console.log("Verified HTTP 200 and approved bytes: "+path);
          }
          const api="https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/workers/scripts/re-culture-public-guidance-mcp/deployments";
          const r=await fetch(api,{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN}});
          const j=await r.json();
          if(!r.ok || !j.success) throw new Error("Production verification unavailable");
          if(JSON.stringify(j.result)!==readFileSync("production-before.json","utf8")) throw new Error("Production deployment changed during preview");
          writeFileSync("preview-verification.json",JSON.stringify({root,results,productionPreserved:true},null,2));
          console.log("Production deployment preserved; eight approved pages served.");
          NODE
