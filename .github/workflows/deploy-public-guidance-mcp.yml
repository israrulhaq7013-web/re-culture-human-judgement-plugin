name: Deploy Re Culture Public Guidance MCP

on:
  workflow_dispatch:
    inputs:
      rate_namespace:
        description: 'Unused Cloudflare rate-limit namespace ID confirmed for this MCP Worker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: re-culture-public-guidance-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-public-guidance
    steps:
      - name: Check Out Reviewed MCP Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 51b9523f2d455c4439109ed06f13673886894123
          persist-credentials: false
      - name: Set Up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install Locked Dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy Only The Public Guidance Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RE_CULTURE_MCP_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RE_CULTURE_MCP_CF_ACCOUNT_ID }}
          PUBLIC_GUIDANCE_RATE_NAMESPACE_ID: ${{ inputs.rate_namespace }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const c=JSON.parse(readFileSync("wrangler.jsonc","utf8"));
          if(c.name!=="re-culture-public-guidance-mcp" || c.main!=="src/worker.js" || c.observability?.enabled!==false || c.routes || c.d1_databases || c.kv_namespaces || c.r2_buckets || c.services || c.durable_objects) throw new Error("Deployment target guard failed");
          if(!process.env.CLOUDFLARE_API_TOKEN || !/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID||"")) throw new Error("Required deployment secrets are missing or invalid");
          '
          npm run deploy
